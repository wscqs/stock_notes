        return { codes: codes, count: rows.length, rows: rows };
    }

    // 跌停池：供"跌停"视图展示（首次跌停时间由分时数据估算）
    async function fetchLowerLimitPool(dateYYYYMMDD){
        const rows = await fetchPoolAll(LOWER_LIMIT_POOL_API, dateYYYYMMDD);
        rows.forEach(s => {
            const m = estimateDownTime(s);
            s._downMin = m;
            s._downText = (m === null) ? '--:--' : ('~' + pad2(Math.floor(m / 60)) + ':' + pad2(m % 60));
        });
        return { rows: rows, count: rows.length };
    }

    // 涨跌分布：冰点判定的市场广度/涨跌停家数来源（同花顺 dq 域，支持历史日期）
    async function fetchUpDownDistribution(dateYYYYMMDD){
        const url = `${UPDOWN_API}?date=${dateYYYYMMDD}`;
        try {
            const resp = await fetch(url, { headers: { 'User-Agent': USER_AGENT, 'Referer': 'https://dq.10jqka.com.cn/' } });
            const json = await resp.json();
            if(json.status_code === 0 && json.data) return json.data;
            return null;
        } catch(e){ console.warn('获取涨跌分布失败', e); return null; }
    }

    // 装配抱团所需的全市场数据（同花顺四池：涨停/炸板/跌停 + 涨跌分布）
    async function loadHugMarketData(dateYYYYMMDD){
        const [ztRes, failRes, downRes, ud] = await Promise.all([
            fetchLimitUpPool(dateYYYYMMDD),
            fetchOpenLimitPool(dateYYYYMMDD),
            fetchLowerLimitPool(dateYYYYMMDD),
            fetchUpDownDistribution(dateYYYYMMDD)
        ]);
        hugLimitUpMap = ztRes.map;
        hugAllFund = ztRes.allFund;
        hugFailCodes = failRes.codes;
        hugFailTotal = failRes.count;
        openPoolRows = failRes.rows;
        downPoolRows = downRes.rows;
        hugUpDown = ud;
        hugZtTotal = ztRes.rows.length;

        // 连板数来自板块榜个股（continue_num），封单额/首封时间来自涨停池
        hugMaxHeight = 0;
        allBlocksRaw.forEach(b => {
            (b.stock_list || []).forEach(s => {
                const rec = hugLimitUpMap.get(s.code);
                if(!rec) return;
                const cn = Number(s.continue_num) || 0;
                if(cn > 0){ rec._continue = cn; }
                if(!rec.high_days && s.high_days) rec.high_days = s.high_days;
                if(rec._continue > hugMaxHeight) hugMaxHeight = rec._continue;
            });
        });
        // 兜底：涨停池 high_days 解析最高板
        if(hugMaxHeight === 0){
            hugLimitUpMap.forEach(s => {
                const tb = s._totalBoards || 1;
                if(tb > hugMaxHeight) hugMaxHeight = tb;
            });
        }
        hugHotBoardCount = allBlocksRaw.filter(b => (b.limit_up_num || 0) >= 3).length;
        marketLimitUpTotal = hugZtTotal;
    }

    async function loadDataByDate(dateYYYYMMDD){
        if(!dateYYYYMMDD) return;
        const tradeDays = await fetchTradeDays(dateYYYYMMDD);
        if(tradeDays.length) allTradeDays = tradeDays;
        updateCalendarEnableDates();
        const blocks = await fetchBlockTop(dateYYYYMMDD);
        if(!blocks.length){
            allBlocksRaw = [];
            marketLimitUpTotal = 0;
            hugLimitUpMap = new Map();
            hugFailCodes = new Set();
            hugUpDown = null;
            hugZtTotal = 0; hugFailTotal = 0; hugAllFund = 0; hugMaxHeight = 0;
            openPoolRows = []; downPoolRows = [];
            currentBlock = null;
            buildHugGroups();
            currentHugKey = null;
            eventListContainer.innerHTML = '<div class="empty">无板块数据，尝试其他日期</div>';
            clearRightPanel();
            return;
        }
        allBlocksRaw = blocks;
        // 抱团数据源（同花顺涨停池/炸板池/涨跌分布）
        await loadHugMarketData(dateYYYYMMDD);
        buildHugGroups();
        if(!hugGroups.some(g => g.key === currentHugKey)){
            currentHugKey = hugGroups.length ? hugGroups[0].key : null;
        }
        const sorted = sortBlocksByStrong(blocks);
        // 刷新时尽量保持当前选中板块
        let keep = null;
        if(currentBlock) keep = blocks.find(b => b.code === currentBlock.code);
        currentBlock = keep || sorted[0];
        if(!keep) activeReasonTag = null;
        renderLeftPanelByView();
        updateRightPanel();
        if(flatpickrInstance) flatpickrInstance.setDate(formatDateYMD(dateYYYYMMDD), false);
    }

    async function refreshCurrentData(){
        if(!currentDate) return;
        await loadDataByDate(currentDate);
    }

    // ------------------- 日历 & 交易日 -------------------
    function updateCalendarEnableDates(){
        if(!flatpickrInstance) return;
        const enabledDates = allTradeDays.map(d => formatDateYMD(d));
        flatpickrInstance.set('enable', enabledDates);
        flatpickrInstance.redraw();
        if(currentDate) flatpickrInstance.setDate(formatDateYMD(currentDate), false);
    }

    function initCalendar(){
        if(flatpickrInstance) flatpickrInstance.destroy();
        flatpickrInstance = flatpickr(calendarInput, {
            locale: 'zh',
            dateFormat: 'Y-m-d',
            allowInput: false,
            disableMobile: true,
            enable: [],
            onChange: async (selectedDates, dateStr) => {
                if(dateStr){
                    const newDateYYYYMMDD = toYYYYMMDD(dateStr);
                    if(newDateYYYYMMDD !== currentDate){
                        currentDate = newDateYYYYMMDD;
                        await loadDataByDate(currentDate);
                    }
                }
            }
        });
        if(allTradeDays.length) updateCalendarEnableDates();
        if(currentDate) flatpickrInstance.setDate(formatDateYMD(currentDate), false);
    }

    async function changeTradeDay(delta){
        if(!allTradeDays.length){
            const base = currentDate || localTodayYYYYMMDD();
            allTradeDays = await fetchTradeDays(base);
        }
        let idx = allTradeDays.indexOf(currentDate);
        if(idx === -1 && currentDate){
            const nearest = allTradeDays.find(d => d >= currentDate) || allTradeDays[allTradeDays.length - 1];
            if(nearest) idx = allTradeDays.indexOf(nearest);
        }
        const newIdx = idx + delta;
        if(newIdx >= 0 && newIdx < allTradeDays.length){
            currentDate = allTradeDays[newIdx];
            await loadDataByDate(currentDate);
        } else {
            alert(delta > 0 ? '已是最新交易日' : '已是最早交易日');
        }
    }

    // ------------------- 视图切换 -------------------
    function switchView(view){
        if(view === currentView) return;
        currentView = view;
        viewThemeBtn.classList.toggle('active', view === 'theme');
        viewPlateBtn.classList.toggle('active', view === 'plate');
        viewHugBtn.classList.toggle('active', view === 'hug');
        viewBrokenBtn.classList.toggle('active', view === 'broken');
        viewDownBtn.classList.toggle('active', view === 'down');
        // 切换视图时重置排序与池选中
        currentSortField = null; currentSortOrder = 'asc'; poolActiveCode = null;
        if(view === 'hug'){
            buildHugGroups();
            if(!hugGroups.some(g => g.key === currentHugKey)){
                currentHugKey = hugGroups.length ? hugGroups[0].key : null;
            }
        }
        renderLeftPanelByView();
        updateRightPanel();
        // 移动端切换视图后回到列表页，便于重新选择板块
        showPane('list');
    }

    // ------------------- 自动刷新 -------------------
    function stopAutoRefresh(){ if(refreshTimer){ clearInterval(refreshTimer); refreshTimer = null; } }
    function startAutoRefresh(){
        stopAutoRefresh();
        if(currentInterval > 0) refreshTimer = setInterval(() => { refreshCurrentData(); }, currentInterval);
    }
    function changeRefreshInterval(ms){ currentInterval = ms; startAutoRefresh(); }

    // ------------------- 启动 -------------------
    async function bootstrap(){
        const today = localTodayYYYYMMDD();
        const tradeDays = await fetchTradeDays(today);
        if(tradeDays.length){
            allTradeDays = tradeDays;
            let target = tradeDays.find(d => d >= today);
            if(!target) target = tradeDays[tradeDays.length - 1];
            currentDate = target;
        } else {
            currentDate = today;
        }
        initCalendar();
        // 从目标日期向前找最近有数据的交易日(盘前/节假日当天可能无数据)
        let idx = allTradeDays.indexOf(currentDate);
        let loaded = false;
        for(let i = 0; i < 15; i++){
            const blocks = await fetchBlockTop(currentDate);
            if(blocks.length){
                allBlocksRaw = blocks;
                await loadHugMarketData(currentDate);
                buildHugGroups();
                currentHugKey = hugGroups.length ? hugGroups[0].key : null;
                const sorted = sortBlocksByStrong(blocks);
                currentBlock = sorted[0];
                renderLeftPanelByView();
                updateRightPanel();
                if(flatpickrInstance) flatpickrInstance.setDate(formatDateYMD(currentDate), false);
                loaded = true;
                break;
            }
            if(idx > 0){ idx--; currentDate = allTradeDays[idx]; }
            else break;
        }
        if(!loaded){
            eventListContainer.innerHTML = '<div class="empty">近期交易日均无板块数据</div>';
            clearRightPanel();
        }
        startAutoRefresh();
    }

    // ------------------- 事件绑定 -------------------
    prevDayBtn.addEventListener('click', () => changeTradeDay(-1));
    nextDayBtn.addEventListener('click', () => changeTradeDay(1));
    manualBtn.addEventListener('click', () => refreshCurrentData());
    refreshSelect.addEventListener('change', function(){
        const val = parseInt(this.value, 10);
        changeRefreshInterval(isNaN(val) ? 0 : val);
    });
    viewThemeBtn.addEventListener('click', () => switchView('theme'));
    viewPlateBtn.addEventListener('click', () => switchView('plate'));
    viewHugBtn.addEventListener('click', () => switchView('hug'));
    viewBrokenBtn.addEventListener('click', () => switchView('broken'));
    viewDownBtn.addEventListener('click', () => switchView('down'));

    // ------------------- 移动端交互 -------------------
    // 降级面板：关闭、主按钮再次唤起 App
    function closeAppJump(){
        const panel = document.getElementById('appJump');
        if(panel) panel.classList.remove('show');
    }
    document.getElementById('appJumpClose').addEventListener('click', closeAppJump);
    document.getElementById('appJumpMask').addEventListener('click', closeAppJump);
    document.getElementById('appJumpBtn').addEventListener('click', (e) => {
        const code = e.currentTarget.dataset.code || '';
        if(code) openStockNoteEdit(code);
    });
    document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeAppJump(); });

    // 记录顶栏实际高度到 --topbar-h，供返回条吸顶定位避让
    function syncTopBarHeight(){
        const bar = document.querySelector('.top-bar');
        const app = document.querySelector('.app-container');
        if(!bar || !app) return;
        app.style.setProperty('--topbar-h', Math.round(bar.getBoundingClientRect().height) + 'px');
    }
    syncTopBarHeight();
    window.addEventListener('resize', syncTopBarHeight);
    if(window.ResizeObserver){
        const ro = new ResizeObserver(syncTopBarHeight);
        const bar = document.querySelector('.top-bar');
        if(bar) ro.observe(bar);
    }
    // 返回列表：明细 → 列表
    document.getElementById('mobileBackBtn').addEventListener('click', () => showPane('list'));
    // 移动端排序下拉（表头隐藏后的替代入口）
    document.getElementById('mobileSortSelect').addEventListener('change', function(){
        const v = this.value;
        if(!v){
            currentSortField = null;
            currentSortOrder = 'asc';
        } else {
            const parts = v.split('|');
            currentSortField = parts[0];
            currentSortOrder = parts[1] || 'asc';
        }
        rerenderCurrentTable();
        updateSortHeaderStyle();
    });
    // 视口跨越移动端断点时复位单栏状态并重算单元格标签，避免残留隐藏
    window.matchMedia('(max-width: 820px)').addEventListener('change', () => {
        const app = document.querySelector('.app-container');
        if(app){ app.classList.remove('pane-list', 'pane-detail'); }
        applyCellLabels();
    });
    // 初始进入移动端时默认展示列表
    if(isMobileView()){
        const app = document.querySelector('.app-container');
        if(app) app.classList.add('pane-list');
    }

    bootstrap();
})();
</script>
