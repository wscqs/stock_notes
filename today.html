<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#1e1e2f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    <title>同花顺今天炒什么 · 双模增强版</title>
    <!-- Flatpickr 日历组件 (深色主题 + 中文) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/zh.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "Segoe UI", system-ui, -apple-system, sans-serif;
        }

        body {
            background: #1e1e2f;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            color: #b1b1b5;
        }

        .app-container {
            width: 100%;
            max-width: 1400px;
            background: #1e1e2f;
            border: 1px solid #313452;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* 顶部栏 */
        .top-bar {
            background: #26293b;
            border-bottom: 1px solid #313452;
            padding: 3px 16px;
            margin-bottom: 1px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .title-area {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
        }

        .title-area>* {
            margin-right: 16px;
        }

        .title-area> :last-child {
            margin-right: 0;
        }

        .main-title {
            font-size: 16px;
            font-weight: 700;
            color: #e0e0e5;
        }

        /* 双模导航按钮 */
        .view-nav {
            display: flex;
            background: #27293d;
        }
        .view-nav > * {
            margin-right: 8px;
        }
        .view-nav > :last-child {
            margin-right: 0;
        }
        .view-btn {
            background: transparent;
            border: none;
            color: #aaa;
            font-size: 13px;
            font-weight: 500;
            padding: 4px 12px;
            border-radius: 2px;
            cursor: pointer;
            transition: 0.2s;
        }
        .view-btn.active {
            background: #2d3a5e;
            color: #ffffff;
            border-bottom: 2px solid #6f9eff;
        }
        .view-btn:hover:not(.active) {
            background: #3a3e5e;
            color: #e0e0e5;
        }

        .date-nav {
            display: flex;
            align-items: center;
            background: #27293d;
            border: 1px solid #393d60;
            border-radius: 4px;
            padding: 1px 5px;
        }

        .date-nav>* {
            margin-right: 4px;
        }

        .date-nav> :last-child {
            margin-right: 0;
        }

        .date-nav-btn {
            background: none;
            border: none;
            color: #6f9eff;
            font-size: 12px;
            cursor: pointer;
            padding: 0 3px;
            font-weight: bold;
            border-radius: 3px;
            transition: 0.1s;
        }

        .date-nav-btn:hover {
            background: #3a3e5e;
            color: white;
        }

        /* 日历输入框 */
        .calendar-input-wrapper {
            margin-left: 2px;
        }

        #calendarInput {
            background: #1e1e2f;
            border: 0px solid #393d60;
            color: #e0e0e5;
            border-radius: 4px;
            padding: 2px 0;
            width: 80px;
            font-size: 12px;
            cursor: pointer;
            text-align: center;
        }

        #calendarInput:hover {
            border-color: #6f9eff;
        }

        /* flatpickr 日历样式 */
        .flatpickr-calendar {
            background: #1e1e2f !important;
            border: 2px solid #393d60 !important;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5) !important;
            width: 260px !important;
        }

        .flatpickr-months,
        .flatpickr-weekdays {
            font-size: 12px !important;
            width: 260px !important;
        }
        .flatpickr-month {background: #26293b !important;}
        .flatpickr-monthDropdown-months {background: transparent !important;}
        span.flatpickr-weekday {
            background: #1e1e2f !important;
        }

        .flatpickr-current-month {
            font-size: 13px !important;
        }

        .dayContainer,
        .flatpickr-days {
            width: 260px !important;
            min-width: 260px !important;
            max-width: 260px !important;
        }

        .flatpickr-day {
            color: #e0e0e5 !important;
            font-size: 12px !important;
            border-radius: 50px !important;
            max-width: 36px !important;
            height: 36px !important;
            line-height: 36px !important;
        }

        .flatpickr-rContainer .flatpickr-day.disabled,
        .flatpickr-day.disabled:hover {
            background: #1e1e2f !important;
            color: #6c6f8a !important;
            opacity: 0.6;
            text-decoration: line-through;
        }

        .flatpickr-day.flatpickr-disabled,
        .flatpickr-day.flatpickr-disabled:hover {
            background: #1e1e2f !important;
            color: #6c6f8a !important;
            cursor: not-allowed;
        }

        .flatpickr-day.selected {
            background: #6f9eff !important;
            border-color: #6f9eff !important;
        }

        .refresh-controls {
            display: flex;
            align-items: center;
        }

        .refresh-controls>* {
            margin-left: 8px;
        }

        .refresh-btn {
            background: transparent;
            border: none;
            color: #e0e0e5;
            padding: 2px 6px;
            border: 1px solid #393d60;
            border-radius: 3px;
            font-size: 13px;
            cursor: pointer;
        }

        .refresh-selector {
            background: #27293d;
            border: 1px solid #393d60;
            color: #e0e0e5;
            padding: 2px 4px;
            border-radius: 3px;
            font-size: 12px;
            cursor: pointer;
        }

        .middle-panel {
            display: flex;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        .left-side {
            width: 450px;
            background: #1e1e2f;
            border-right: 1px solid #313452;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .event-list-header {
            padding: 10px 12px 6px;
            font-weight: 600;
            color: #e0e0e5;
            border-bottom: 1px solid #313452;
            background: #26293b;
            font-size: 15px;
        }

        .event-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 0;
        }

        .event-item {
            padding: 8px 12px;
            border-bottom: 1px solid #313452;
            cursor: pointer;
            transition: background 0.15s;
            background: #26293b;
        }

        .event-item:hover {
            background: #313452;
        }

        .event-item.active {
            border-left: 3px solid #ffb347;
            background: #2d3046;
        }

        /* 排序号样式 */
        .rank-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 20px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 3px;
            margin-right: 10px;
            flex-shrink: 0;
            background-color: #313452;
            color: #fff;
        }
        .rank-1 { background-color: #ff2436; }
        .rank-2 { background-color: #ff9b43; }
        .rank-3 { background-color: #ffc647; color: #1e1e2f; }

        /* 抱团评分样式 */
        .hug-tag {
            font-size: 11px;
            padding: 1px 6px;
            border-radius: 3px;
            margin-right: 6px;
            border: 1px solid transparent;
        }
        .hug-score {
            font-size: 14px;
            font-weight: 700;
            font-family: monospace;
        }
        .hug-hot { color: #ff5a5a; }
        .hug-hot.hug-tag { border-color: #ff5a5a; background: rgba(255,90,90,0.12); }
        .hug-strong { color: #ffb347; }
        .hug-strong.hug-tag { border-color: #ffb347; background: rgba(255,179,71,0.12); }
        .hug-warm { color: #6f9eff; }
        .hug-warm.hug-tag { border-color: #6f9eff; background: rgba(111,158,255,0.12); }
        .hug-none { color: #8c909a; }
        .hug-none.hug-tag { border-color: #5a5e78; background: rgba(140,144,154,0.10); }

        /* 抱团：环境冰点条 */
        .hug-env-bar {
            margin: 0 0 10px;
            padding: 9px 11px;
            background: linear-gradient(135deg, rgba(255,90,90,0.10), rgba(49,50,82,0.55));
            border: 1px solid #3a3d63;
            border-radius: 6px;
        }
        .hug-env-head { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; flex-wrap: wrap; }
        .hug-env-title { font-size: 12px; color: #b8bccd; font-weight: 600; }
        .hug-env-badge {
            font-size: 11px; padding: 1px 7px; border-radius: 3px;
            border: 1px solid #5a5e78; background: rgba(140,144,154,0.12); color: #a8adbf;
        }
        .hug-env-badge.ice-deep { color: #ff5a5a; border-color: #ff5a5a; background: rgba(255,90,90,0.14); }
        .hug-env-badge.ice-retreat { color: #ffb347; border-color: #ffb347; background: rgba(255,179,71,0.14); }
        .hug-env-badge.ice-chaos { color: #6f9eff; border-color: #6f9eff; background: rgba(111,158,255,0.14); }
        .hug-env-badge.ice-warm { color: #6fcf97; border-color: #6fcf97; background: rgba(111,207,151,0.12); }
        .hug-env-score { font-size: 11px; color: #8c909a; font-family: monospace; margin-left: auto; }
        .hug-env-cells { display: flex; flex-wrap: wrap; gap: 4px 10px; }
        .hug-env-cell { display: inline-flex; align-items: baseline; gap: 4px; font-size: 11px; }
        .hug-env-k { color: #7d8195; font-style: normal; }
        .hug-env-v { font-family: monospace; font-weight: 700; color: #e0e0e5; }
        .hug-env-v.hug-env-up { color: #ff7b72; }
        .hug-env-v.hug-env-down { color: #6fcf97; }
        .hug-env-hint { margin-top: 7px; font-size: 11px; color: #9aa0b5; border-top: 1px dashed #3a3d63; padding-top: 6px; }

        /* 抱团股角色标签 */
        .hug-role {
            display: inline-block; font-size: 10px; padding: 1px 5px; border-radius: 3px;
            margin-right: 6px; font-weight: 700; vertical-align: middle; white-space: nowrap;
        }
        .hug-role-lead { background: #ff2436; color: #fff; }
        .hug-role-branch { background: rgba(255,179,71,0.20); color: #ffb347; border: 1px solid rgba(255,179,71,0.5); }
        .hug-role-alive { background: rgba(111,158,255,0.16); color: #6f9eff; border: 1px solid rgba(111,158,255,0.45); }
        .hug-cont {
            display: inline-block; font-size: 10px; padding: 0 4px; border-radius: 2px;
            margin-left: 5px; background: rgba(255,36,54,0.18); color: #ff8a95;
            border: 1px solid rgba(255,36,54,0.4); vertical-align: middle; white-space: nowrap;
        }
        .hug-cont-rev { background: rgba(111,158,255,0.14); color: #8fb2ff; border-color: rgba(111,158,255,0.4); }

        .event-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            align-items: center;
        }
        .event-title-wrapper {
            display: flex;
            align-items: center;
            flex: 1;
        }
        .event-title {
            color: #e0e0e5;
            font-size: 14px;
            font-weight: 500;
            line-height: 1.4;
        }

        /* 热度图标样式 */
        .heat-area {
            font-size: 13px;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            padding-left: 10px;
        }
        .heat-icon {font-size: 12px;}
        /* 板块涨幅样式 */
        .plate-rise-in-header {
            font-size: 13px;
            font-weight: 600;
            margin-right: 12px;
            font-family: monospace;
        }
        .gain-red { color: #ff7b72; }
        .gain-green { color: #6fcf97; }
        .heat-level-1 { color: #6c8eff; }
        .heat-level-2 { color: #4caf50; }
        .heat-level-3 { color: #ffaa5e; }
        .heat-level-4 { color: #ff7b7b; }

        .event-concept-row {
            margin: 6px 0;
            font-size: 13px;
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
        }
        .concept-label { color: #8c909a; margin-right: 6px; }
        .concept-badge-list { display: inline-flex; flex-wrap: wrap; }
        .concept-badge {
            background: #2a2c3f;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 12px;
            margin-right: 6px;
            margin-bottom: 4px;
            color: #6f9eff;
        }
        .event-direction-row {
            font-size: 13px;
            margin: 6px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .concept-row {
            background-color: #1e1e2f;
            border-radius: 5px;
            padding: 5px 10px;
        }
        .direction-value {
            color: #8c909a;
            display: flex;
            align-items: center;
        }
        .direction-content {
            font-size: 12px;
            color: #ffaa33;
            border: 1px solid #313452;
            border-radius: 2px;
            padding: 1px 6px;
        }
        .lead-stock {
            color: #8c909a;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
        }

        .lead-stock > * {
            margin: 0 10px;
        }
        .lead-stock > :last-child {
            margin-right: 0;
        }
        .lead-stockname {
            font-size: 12px;
            color: #e0e0e5;
        }
        .lead-stock-rise {
            font-size: 12px;
            margin-left: 4px;
        }

        /* 热点板块专用样式 */
        .plate-meta-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin: 5px 0;
            font-size: 13px;
        }
        .plate-stats-group {
            display: flex;
            align-items: center;
        }

        .plate-stats-group > * {
            margin-right: 12px;
        }
        .plate-stats-group > :last-child {
            margin-right: 0;
        }
        .plate-limit {
            color: #ff7b72;
            font-weight: 500;
        }
        .drive-event-row {
            margin-top: 6px;
            font-size: 13px;
            color: #8c909a;
            border-top: 1px dashed #313452;
            padding-top: 5px;
        }

        .drive-event-text {
            color: #e0e0e5;
        }

        .right-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: #1e1e2f;
            margin-left: 2px;
            overflow: hidden;
        }

        .driver-event-box {
            background: #26293b;
            border-bottom: 1px solid #313452;
            padding: 0px 16px 6px;
        }

        .driver-subtitle {
            font-size: 14px;
            color: #e0e0e5;
            font-weight: 600;
            margin-bottom: 1px;
            padding: 8px 10px;
        }

        .driver-content {
            font-size: 13px;
            line-height: 1.7;
            color: #b1b1b5;
            max-height: 75px;
            background-color: #1e1e2f;
            border-radius: 5px;
            padding: 5px 15px;
            overflow: hidden;
            transition: max-height 0.2s ease;
        }

        .driver-content.expanded {
            max-height: 500px;
            overflow-y: auto;
        }

        .expand-btn {
            color: #6f9eff;
            cursor: pointer;
            font-size: 12px;
            margin-top: 6px;
            display: inline-block;
            user-select: none;
        }

        .sub-concept-tabs {
            display: flex;
            overflow-x: auto;
            padding: 5px 12px;
            background: #1e1e2f;
            border-bottom: 1px solid #313452;
            flex-wrap: nowrap;
        }

        .sub-tab {
            background: #27293d;
            color: #aaa;
            font-size: 12px;
            padding: 4px 12px;
            margin-right: 5px;
            border-radius: 20px;
            white-space: nowrap;
            cursor: pointer;
            border: 1px solid #393d60;
        }

        .sub-tab.active {
            color: #ffffff;
            border-color: #6f9eff;
            background: #2d3a5e;
        }

        .stock-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 12px;
            background: #26293b;
            border-bottom: 1px solid #313452;
        }

        .stock-count {
            font-size: 13px;
            color: #e0e0e5;
            font-weight: 600;
        }

        .stock-table-wrapper {
            flex: 1;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            min-width: 500px;
        }

        th {
            text-align: left;
            padding: 10px 8px 6px 12px;
            background: #26293b;
            color: #8c909a;
            font-weight: 500;
            position: sticky;
            top: 0;
            border-bottom: 1px solid #313452;
        }

        td {
            padding: 5px 8px 5px 12px;
            border-bottom: 1px solid #313452;
            color: #e0e0e5;
            cursor: pointer;
        }

        .stock-code { color: #e0e0e5; font-family: monospace; }
        .stock-name { font-weight: 500; }
        .gain-positive { color: #ff7b72; }
        .gain-negative { color: #6fcf97; }
        .limit-up { background: #E91E63; color: #fff; padding: 2px 8px; border-radius: 2px; font-size: 11px; display: inline-block; }
        .limit-hit { background: #ffb347; color: #1e1e2f; padding: 2px 6px; border-radius: 3px; font-size: 11px; }

        .footer-note {
            color: #6c6f8a;
            padding: 6px 16px;
            font-size: 11px;
            border-top: 1px solid #313452;
            text-align: right;
            background: #26293b;
        }
        .loading, .error, .empty { padding: 30px; text-align: center; color: #6c6f8a; }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-thumb { background: #393d60; border-radius: 5px; }

        /* ===== 唤起 App 降级面板 ===== */
        .app-jump {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: none;
        }
        .app-jump.show { display: block; }
        .app-jump-mask {
            position: absolute;
            inset: 0;
            background: rgba(10, 10, 18, .66);
        }
        .app-jump-card {
            position: absolute;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%);
            width: min(420px, calc(100vw - 28px));
            background: #26293b;
            border: 1px solid #393d60;
            border-radius: 12px;
            padding: 14px 16px 16px;
            box-shadow: 0 16px 44px rgba(0, 0, 0, .55);
        }
        .app-jump-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .app-jump-title {
            font-size: 15px;
            font-weight: 600;
            color: #e0e0e5;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .app-jump-close {
            background: transparent;
            border: none;
            color: #8c909a;
            font-size: 16px;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .app-jump-close:hover { background: #313452; color: #e0e0e5; }
        .app-jump-tip {
            font-size: 12px;
            color: #9aa0b5;
            line-height: 1.6;
            margin: 6px 0 12px;
        }
        .app-jump-actions {
            display: flex;
            gap: 10px;
        }
        .app-jump-btn {
            flex: 1 1 auto;
            text-align: center;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            text-decoration: none;
            min-height: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .app-jump-btn.primary {
            background: #6f9eff;
            border: 1px solid #6f9eff;
            color: #ffffff;
            font-weight: 600;
        }
        .app-jump-btn.primary:hover { background: #5f8fea; }
        .app-jump-btn.ghost {
            background: transparent;
            border: 1px solid #393d60;
            color: #b1b1b5;
            flex: 0 1 auto;
        }
        .app-jump-btn.ghost:hover { background: #313452; color: #e0e0e5; }

        /* ===== 涨停池明细（整合自 同花顺最强风口） ===== */
        .emotion-card { background:#1e1e2f; padding:10px 16px 4px; display:flex; flex-wrap:wrap; border-bottom:1px solid #313452; }
        .emotion-title { color:#e0e0e5; font-size:15px; font-weight:600; margin-right:20px; }
        .emotion-item { display:flex; margin-right:32px; margin-bottom:4px; }
        .emotion-label { font-size:12px; color:#8c909a; }
        .emotion-value { font-size:14px; font-weight:500; color:#ffb347; line-height:1.3; margin-left:10px; }
        th.sortable { cursor:pointer; user-select:none; }
        th.sortable:hover { background:#3a3e5e; }
        th.sortable::after { content:" ⇅"; font-size:10px; opacity:0.6; }
        th.sort-asc::after { content:" ▲"; opacity:1; }
        th.sort-desc::after { content:" ▼"; opacity:1; }
        .stock-row-main:hover { background:#2a2d42; }

<script>
(function(){
    // ------------------- API 常量 -------------------
    // 修复说明: 原 news.10jqka.com.cn 事件接口已将跨域白名单锁定为 basic.10jqka.com.cn,
    // 本地页面(fetch 来自 file:// 或 localhost)被浏览器 CORS 拦截, 导致"无法获取初始事件"。
    // 现改用与"同花顺最强风口"相同的 data.10jqka.com.cn 接口(回显 Origin, 允许本地调用)。
    const BLOCK_TOP_API = 'https://data.10jqka.com.cn/dataapi/limit_up/block_top';
    const TRADE_DAY_API = 'https://data.10jqka.com.cn/dataapi/limit_up/trade_day';
    const LIMIT_UP_POOL_API = 'https://data.10jqka.com.cn/dataapi/limit_up/limit_up_pool';
    const OPEN_LIMIT_POOL_API = 'https://data.10jqka.com.cn/dataapi/limit_up/open_limit_pool';
    const LOWER_LIMIT_POOL_API = 'https://data.10jqka.com.cn/dataapi/limit_up/lower_limit_pool';
    const UPDOWN_API = 'https://dq.10jqka.com.cn/fuyao/up_down_distribution/distribution/v2/realtime';
    const USER_AGENT = 'Mozilla/5.0 (Linux; Android 6.0; Nexus 5 Build/MRA58N) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/146.0.0.0 Mobile Safari/537.36';

    // ------------------- 辅助函数 -------------------
    function pad2(n){ return String(n).padStart(2,'0'); }
    function localTodayYYYYMMDD(){ const d = new Date(); return `${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}`; }
    function formatDateYMD(ymd){ if(!ymd || ymd.length !== 8) return ''; return `${ymd.slice(0,4)}-${ymd.slice(4,6)}-${ymd.slice(6,8)}`; }
    function toYYYYMMDD(dash){ return dash.replace(/-/g,''); }
    function escapeHtml(str){ if(str === null || str === undefined) return ''; return String(str).replace(/[&<>]/g, m => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;')); }
    function escapeAttr(str){ return escapeHtml(str).replace(/"/g, '&quot;'); }
    function getBoardNumber(highStr){ if(!highStr) return 0; const m = String(highStr).match(/(\d+)板/); if(m) return parseInt(m[1],10); if(String(highStr).includes('首板')) return 1; return 0; }
    function filterStocks(list){ if(!list) return []; return list.filter(s => s.is_st !== 1 && s.is_new !== 1); }
    // 热度(以板块涨停家数衡量)
    function getHeatIcon(n){ if(n >= 10) return '🔥🔥🔥'; if(n >= 5) return '🔥🔥'; return '🔥'; }
    function getHeatLevelClass(n){ if(n >= 10) return 'heat-level-4'; if(n >= 5) return 'heat-level-3'; if(n >= 2) return 'heat-level-2'; return 'heat-level-1'; }

    // 板块排序: 涨停家数 -> 连板家数 -> 高度 -> 上榜天数
    function sortBlocksByStrong(blocks){
        if(!blocks) return [];
        return [...blocks].sort((a, b) => {
            if(a.limit_up_num !== b.limit_up_num) return (b.limit_up_num || 0) - (a.limit_up_num || 0);
            if(a.continuous_plate_num !== b.continuous_plate_num) return (b.continuous_plate_num || 0) - (a.continuous_plate_num || 0);
            const ha = getBoardNumber(a.high), hb = getBoardNumber(b.high);
            if(ha !== hb) return hb - ha;
            return (b.days || 0) - (a.days || 0);
        });
    }

    // 从板块个股涨停原因中聚合"关联概念"标签(按出现频次降序)
    function getBlockReasonTags(block, maxN){
        const cnt = new Map();
        filterStocks(block ? block.stock_list : []).forEach(s => {
            if(!s.reason_type) return;
            String(s.reason_type).split('+').forEach(t => { t = t.trim(); if(t) cnt.set(t, (cnt.get(t) || 0) + 1); });
        });
        return [...cnt.entries()].sort((a, b) => b[1] - a[1]).slice(0, maxN || 8).map(e => e[0]);
    }

    // 领涨股: 连板数最高者优先, 其次涨幅最高
    function getLeadStock(block){
        const stocks = filterStocks(block ? block.stock_list : []);
        if(!stocks.length) return null;
        return [...stocks].sort((a, b) => {
            const ca = a.continue_num || 0, cb = b.continue_num || 0;
            if(ca !== cb) return cb - ca;
            return (b.change_rate || 0) - (a.change_rate || 0);
        })[0];
    }

    // ================= 【抱团概念定义 · 游资冰点抱团取暖】 =================
    // ⚠ 与"机构研报抱团"严格区分：
    //   机构抱团 = 机构基于基本面共识长期重仓同一批白马，跨月跨季，与行情冷热无关。
    //   本工具   = 游资在【行情冰点】的抱团取暖行为：
    //              增量资金枯竭、赚钱效应坍塌、市场无主线时，活跃短线资金放弃"分散试错"，
    //              极度收缩集中到【少数几个高辨识度标的】上取暖续命。
    //              形态 = 总龙(最高连板) + 分支龙(次高连板) + 活口(反包/大资金首板)。
    //
    // 四大必要条件（缺一不可）：
    //   1) 环境冰点：涨停萎缩/跌停增多/炸板率高/连板高度压缩/红盘率低 —— 抱团的动机来源
    //   2) 资金聚焦：板块封单额占比 + 涨停家数占比高（钱往一处挤）
    //   3) 龙头梯队：存在真龙头且带得动小弟（板块涨停≥3家），孤狼涨停是陷阱
    //   4) 出手同步：梯队个股封板时间集中（同批资金同时下手）
    //
    // 输出：抱团主线（按总龙锚定去重）+ 抱团股（总龙1+分支龙≤2+活口≤1，每主线≤4只、全市场≤12只）
    //       —— 真实抱团是"钱堆到一只或两只票上"，一天绝不可能有39只。
    // ==============================================================
    const HUG_CFG = {
        minJaccard: 0.33,      // 板块合并相似度阈值（机器人/新能源汽车/人形机器人 实为一条线）
        minShared: 3,          // 合并所需最少共有涨停股
        maxPickPerLine: 4,     // 每条主线最多几只抱团股
        maxPickTotal: 12,      // 全市场最多几只抱团股
        minLineZt: 3,          // 龙头带小弟：板块最少涨停家数
        scoreStrong: 75,
        scoreGood: 60,
        scoreWeak: 45
    };

    // 情绪冰点分 0-100（越高越冰）—— 游资抱团取暖的"动机"来源
    function calcIceScore(ztN, zbN, ud, maxH){
        let s = 0;
        // 涨停家数萎缩（25）
        if(ztN <= 20) s += 25; else if(ztN <= 30) s += 20; else if(ztN <= 40) s += 14;
        else if(ztN <= 50) s += 8; else if(ztN <= 70) s += 3;
        // 跌停家数（20）
        const dt = Number(ud && ud.limit_down) || 0;
        if(dt >= 20) s += 20; else if(dt >= 10) s += 15; else if(dt >= 5) s += 9; else if(dt >= 2) s += 4;
        // 炸板率（20）
        const denom = ztN + zbN;
        const br = denom ? (zbN / denom * 100) : 0;
        if(br >= 45) s += 20; else if(br >= 35) s += 15; else if(br >= 25) s += 10; else if(br >= 15) s += 5;
        // 连板高度压缩（15）
        if(maxH <= 2) s += 15; else if(maxH === 3) s += 12; else if(maxH === 4) s += 9;
        else if(maxH === 5) s += 6; else s += 2;
        // 红盘率低（20）
        const up = Number(ud && ud.up) || 0, down = Number(ud && ud.down) || 0;
        const red = (up + down) ? (up / (up + down) * 100) : 50;
        if(red <= 25) s += 20; else if(red <= 35) s += 14; else if(red <= 45) s += 8; else if(red <= 60) s += 3;
        return Math.round(s * 10) / 10;
    }

    // 环境状态 + 抱团判定线（越不冰点，抱团越不成立）
    function iceEnvOf(sc){
        if(sc >= 70) return { text: '深度冰点', level: 'ice-deep', gate: 58 };
        if(sc >= 55) return { text: '退潮期', level: 'ice-retreat', gate: 60 };
        if(sc >= 40) return { text: '混沌期', level: 'ice-chaos', gate: 62 };
        return { text: '修复/高潮', level: 'ice-warm', gate: 65 };
    }

    // 从 '8天7板' / '3天3板' / '首板' 解析累计板数（活口·反包判定用）
    function parseTotalBoards(s){
        const hd = String((s && s.high_days) || '');
        const m = hd.match(/(\d+)板/);
        return m ? parseInt(m[1], 10) : 1;
    }

    // ------------------- 抱团主线构建（板块聚类 + 总龙锚定） -------------------
    function buildHugLines(){
        hugLines = [];
        if(!allBlocksRaw.length || !hugLimitUpMap.size) return;

        // 1) 每个板块的涨停股集合（剔除 ST / 新股）
        const sets = allBlocksRaw.map(b => new Set(
            filterStocks(b.stock_list || [])
                .filter(s => s.change_tag === 'FIRST_LIMIT' || s.change_tag === 'LIMIT_BACK')
                .map(s => s.code).filter(Boolean)
        ));

        // 2) 单链聚类：把高度重合的板块合并（机器人/新能源汽车/人形机器人 → 一条线）
        const n = allBlocksRaw.length;
        const parent = Array.from({length:n}, (_, i) => i);
        const find = x => { while(parent[x] !== x){ parent[x] = parent[parent[x]]; x = parent[x]; } return x; };
        for(let i = 0; i < n; i++){
            for(let j = i + 1; j < n; j++){
                const a = sets[i], b = sets[j];
                if(!a.size || !b.size) continue;
                let shared = 0;
                a.forEach(c => { if(b.has(c)) shared++; });
                if(shared < HUG_CFG.minShared) continue;
                if(shared / (a.size + b.size - shared) >= HUG_CFG.minJaccard){
                    const ri = find(i), rj = find(j);
                    if(ri !== rj) parent[rj] = ri;
                }
            }
        }
        const groups = new Map();
        for(let i = 0; i < n; i++){
            const r = find(i);
            if(!groups.has(r)) groups.set(r, []);
            groups.get(r).push(i);
        }

        // 3) 每个簇选总龙（连板最高者，并列取封单额大者）
        const raw = [];
        groups.forEach(idxs => {
            const members = idxs.map(i => allBlocksRaw[i]);
            const codes = new Set();
            idxs.forEach(i => sets[i].forEach(c => codes.add(c)));
            const leaders = [...codes].map(c => hugLimitUpMap.get(c)).filter(Boolean)
                .filter(s => (s._continue || 0) >= 2)
                .sort((x, y) => ((y._continue||0) - (x._continue||0)) || ((y.order_amount||0) - (x.order_amount||0)));
            const rep = members.reduce((best, b) => ((b.limit_up_num||0) > (best.limit_up_num||0)) ? b : best, members[0]);
            raw.push({
                anchor: leaders[0] || null,
                leaders: leaders,
                boards: members.map(b => b.name || '--'),
                codes: codes,
                ztN: rep.limit_up_num || 0,
                contBoardN: rep.continuous_plate_num || 0,
                high: rep.high || '--'
            });
        });

        // 4) 按总龙合并：同一只总龙 = 同一波抱团行为
        const byAnchor = new Map();
        raw.forEach(r => {
            const key = r.anchor ? r.anchor.code : ('__noleader__' + r.boards[0]);
            if(!byAnchor.has(key)) byAnchor.set(key, []);
            byAnchor.get(key).push(r);
        });

        byAnchor.forEach(rs => {
            const boards = [], codes = new Set();
            rs.forEach(r => {
                r.boards.forEach(b => { if(boards.indexOf(b) < 0) boards.push(b); });
                r.codes.forEach(c => codes.add(c));
            });
            const leaders = [...codes].map(c => hugLimitUpMap.get(c)).filter(Boolean)
                .filter(s => (s._continue || 0) >= 2)
                .sort((x, y) => ((y._continue||0) - (x._continue||0)) || ((y.order_amount||0) - (x.order_amount||0)));
            hugLines.push({
                name: boards[0] || '--',
                boards: boards,
                codes: codes,
                ztN: rs[0].ztN,
                contBoardN: Math.max.apply(null, rs.map(r => r.contBoardN)),
                high: rs[0].high,
                anchor: leaders[0] || null,
                leaders: leaders
            });
        });
        hugLines.sort((a, b) => b.ztN - a.ztN);
    }

    // ------------------- 抱团主线评分（游资口径四维，满分100） -------------------
    function scoreHugLine(line){
        const stocks = [...line.codes].map(c => hugLimitUpMap.get(c)).filter(Boolean);
        if(!stocks.length) return null;
        const n = stocks.length;
        const fund = stocks.reduce((s, x) => s + (Number(x.order_amount) || 0), 0);
        const fundRatio = hugAllFund > 0 ? (fund / hugAllFund) : 0;
        const ztRatio = hugZtTotal > 0 ? (n / hugZtTotal) : 0;

        // 1) 资金聚焦 30：封单额占比 + 涨停家数占比
        const fs = fundRatio >= .30 ? 30 : fundRatio >= .20 ? 24 : fundRatio >= .12 ? 17
                 : fundRatio >= .07 ? 10 : fundRatio >= .04 ? 5 : 0;
        const zs = ztRatio >= .35 ? 30 : ztRatio >= .25 ? 24 : ztRatio >= .15 ? 16
                 : ztRatio >= .08 ? 8 : 0;
        const conc = (fs + zs) / 2;

        // 2) 梯队强度 25：总龙高度 + 连板家数（龙头带小弟）
        const heights = stocks.map(s => s._continue || 0);
        const maxH = Math.max.apply(null, heights);
        const contN = heights.filter(h => h >= 2).length;
        const hScore = ({0:0,1:3,2:8,3:13,4:17,5:21})[Math.min(maxH,5)] !== undefined ? ({0:0,1:3,2:8,3:13,4:17,5:21})[Math.min(maxH,5)] : 21;
        const cScore = ({0:0,1:5,2:10,3:14,4:18})[Math.min(contN,4)] !== undefined ? ({0:0,1:5,2:10,3:14,4:18})[Math.min(contN,4)] : 18;
        const ladder = (hScore + cScore) / 2;

        // 3) 出手同步 25：抱团股梯队的封板时间集中度（同批资金同时下手）
        const ladderCodes = stocks.filter(s => (s._continue||0) >= 2);
        let ts = ladderCodes.map(s => Number(s.first_limit_up_time) || 0).filter(t => t > 0).sort((a,b)=>a-b);
        let sync;
        if(ts.length >= 4){
            const spread = (ts[Math.floor(3*ts.length/4)] - ts[Math.floor(ts.length/4)]) / 60;
            sync = spread <= 20 ? 25 : spread <= 40 ? 20 : spread <= 75 ? 14 : spread <= 120 ? 8 : 3;
        } else if(ts.length === 3){
            sync = 18;
        } else if(ts.length === 2){
            sync = Math.abs(ts[0]-ts[1]) <= 30*60 ? 14 : 8;
        } else {
            ts = stocks.map(s => Number(s.first_limit_up_time) || 0).filter(t => t > 0).sort((a,b)=>a-b);
            if(ts.length >= 4){
                const spread = (ts[Math.floor(3*ts.length/4)] - ts[Math.floor(ts.length/4)]) / 60;
                sync = spread <= 25 ? 20 : spread <= 50 ? 14 : spread <= 100 ? 8 : 3;
            } else if(ts.length === 3) sync = 12;
            else if(ts.length === 2) sync = 6;
            else sync = 3;
        }

        // 4) 冰点动机 20
        const motive = Math.round(hugIceScore * 0.20 * 10) / 10;
        const total = Math.round((conc + ladder + sync + motive) * 10) / 10;

        return {
            conc: Math.round(conc*10)/10, ladder: Math.round(ladder*10)/10,
            sync: sync, motive: motive, total: total,
            fundRatio: Math.round(fundRatio*10000)/10000, ztRatio: Math.round(ztRatio*10000)/10000,
            maxH: maxH, contN: contN, stockN: n, fund: fund
        };
    }

    function judgeHug(total){
        if(total >= HUG_CFG.scoreStrong) return { level: 'hot', label: '强抱团主线' };
        if(total >= HUG_CFG.scoreGood) return { level: 'strong', label: '抱团主线' };
        if(total >= HUG_CFG.scoreWeak) return { level: 'warm', label: '弱抱团·观察' };
        return { level: 'none', label: '非抱团' };
    }

    // ------------------- 抱团个股（核心修复：39 只 → 真实数量） -------------------
    // 真实游资抱团 = 钱堆到少数几只高辨识度票上：
    //   总龙(连板最高) + 分支龙(次高连板,≤2) + 活口(反包/大资金,≤1)
    function pickHugStocks(line){
        const stocks = [...line.codes].map(c => hugLimitUpMap.get(c)).filter(Boolean)
            .filter(s => !hugFailCodes.has(s.code));
        if(!stocks.length) return [];
        const conts = (line.leaders || []).filter(s => hugLimitUpMap.has(s.code) && !hugFailCodes.has(s.code));
        if(!conts.length) return [];   // 无连板龙头 => 非抱团（首板集群属普涨/轮动）

        // 活口：非连板，但累计板数高（反包/逆势）或封单资金大
        const alive = stocks.filter(s => (s._continue||0) < 2)
            .map(s => Object.assign({}, s, {_tb: parseTotalBoards(s)}))
            .sort((a, b) => ((b._tb||1) - (a._tb||1)) || ((b.order_amount||0) - (a.order_amount||0)));

        const picked = [[conts[0], '总龙']];
        for(let i = 1; i < conts.length && i < 3; i++) picked.push([conts[i], '分支龙']);
        if(alive.length && picked.length < HUG_CFG.maxPickPerLine){
            picked.push([alive[0], (alive[0]._tb||1) >= 2 ? '活口·反包' : '活口']);
        }
        return picked.slice(0, HUG_CFG.maxPickPerLine);
    }

    // ------------------- 抱团分组总装配 -------------------
    function buildHugGroups(){
        hugGroups = [];
        hugStockBoardMap = new Map();
        if(!allBlocksRaw.length || !hugLimitUpMap.size) return;

        // 环境闸门
        hugIceScore = calcIceScore(hugZtTotal, hugFailTotal, hugUpDown, hugMaxHeight);
        const env = iceEnvOf(hugIceScore);
        hugEnv = env;

        buildHugLines();
        const scored = hugLines.map(line => {
            const sc = scoreHugLine(line);
            if(!sc) return null;
            const j = judgeHug(sc.total);
            return { line: line, score: sc, level: j.level, label: j.label };
        }).filter(Boolean).sort((a, b) => b.score.total - a.score.total);

        // 逐条出线：过线 + 有龙头 + 板块带小弟；并做全局去重与总量硬上限
        const used = new Set();
        const out = [];
        for(const r of scored){
            if(r.score.total < env.gate) continue;
            if(r.line.ztN < HUG_CFG.minLineZt) continue;
            if(!r.line.anchor) continue;
            let picks = pickHugStocks(r.line).filter(p => !used.has(p[0].code));
            if(!picks.length) continue;
            picks.forEach(p => used.add(p[0].code));
            r.picks = picks;
            out.push(r);
            if(out.length >= 4) break;
        }
        // 全市场抱团股总量硬上限（一天绝不可能39只）
        let cnt = 0;
        out.forEach(r => {
            const keep = [];
            for(const p of r.picks){
                if(cnt >= HUG_CFG.maxPickTotal) break;
                keep.push(p); cnt++;
            }
            r.picks = keep;
        });

        // 汇总组：全部抱团股（跨主线去重）
        const allPicks = [];
        out.forEach(r => r.picks.forEach(p => allPicks.push(p[0])));
        allPicks.forEach(s => {
            const names = hugLines.filter(l => l.codes.has(s.code)).map(l => l.name);
            hugStockBoardMap.set(s.code, names.join(' / ') || '--');
        });

        out.forEach(r => {
            hugGroups.push({
                key: 'L_' + r.line.name,
                title: r.line.name,
                boards: r.line.boards,
                crossBoards: r.line.boards,
                line: r.line,
                scored: [r.score],
                score: r.score.total,
                level: r.level,
                label: r.label,
                picks: r.picks,
                count: r.picks.length,
                limitCount: r.picks.length,
                lead: r.line.anchor || (r.picks[0] ? r.picks[0][0] : null)
            });
        });

        // 汇总组置顶
        if(allPicks.length){
            const avgScore = out.length ? out.reduce((s, x) => s + x.score.total, 0) / out.length : 0;
            hugGroups.unshift({
                key: '__ALL__',
                title: '全部抱团股',
                isAll: true,
                boards: [],
                crossBoards: [],
                scored: out.map(x => x.score),
                score: avgScore,
                level: out.length ? out[0].level : 'none',
                label: out.length ? out[0].label : '普通热点',
                picks: allPicks.map(s => [s, '']),
                count: allPicks.length,
                limitCount: allPicks.length,
                boardCount: out.length,
                avgScore: avgScore,
                marketTotal: hugZtTotal,
                hotCount: hugHotBoardCount,
                lead: out.length ? out[0].line.anchor : null
            });
        }
    }

    // ------------------- 全局状态 -------------------
    let allTradeDays = [];          // YYYYMMDD
    let currentDate = '';           // YYYYMMDD
    let allBlocksRaw = [];          // 原始板块数据
    let marketLimitUpTotal = 0;     // 全市场涨停家数(兼容字段)
    let currentBlock = null;
    let refreshTimer = null;
    let currentInterval = 300000;
    let flatpickrInstance = null;
    let currentView = 'theme';      // 'theme' | 'plate' | 'hug' | 'broken' | 'down'
    let activeReasonTag = null;     // 右侧子概念(原因标签)筛选
    let currentStocksAll = [];      // 当前板块过滤后个股
    let hugGroups = [];             // 抱团分组(主线级)
    let currentHugKey = null;       // 当前选中抱团分组
    let hugStockBoardMap = new Map(); // 个股代码 -> 所属板块名文本

    // ---- 抱团模块新增状态（同花顺三池口径）----
    let hugLimitUpMap = new Map();  // 涨停池: code -> {封单额, 首封时间, 换手, 板型, 累计板数, 连板数}
    let hugFailCodes = new Set();   // 炸板池代码集合
    let hugUpDown = null;           // 当日涨跌分布 {up,down,limit_up,limit_down,flat}
    let hugZtTotal = 0;             // 全市场涨停家数
    let hugFailTotal = 0;           // 全市场炸板家数
    let hugAllFund = 0;             // 全市场涨停股封单额合计
    let hugMaxHeight = 0;           // 市场最高连板
    let hugIceScore = 0;            // 情绪冰点分 0-100
    let hugEnv = { text: '--', level: 'ice-chaos', gate: 62 }; // 环境状态
    let hugLines = [];              // 抱团主线（总龙锚定）
    let hugHotBoardCount = 0;       // 热点板块数(涨停≥3)
    let openPoolRows = [];          // 炸板池个股明细
    let downPoolRows = [];          // 跌停池个股明细
    let currentSortField = null;    // 明细表排序字段
    let currentSortOrder = 'asc';   // 明细表排序方向
    let currentCols = [];           // 当前明细表列定义（供移动端卡片标签/排序下拉使用）
    let poolActiveCode = null;      // 炸板/跌停视图左侧选中个股代码

    // ------------------- DOM -------------------
    const prevDayBtn = document.getElementById('prevDayBtn');

                const heatClass = getHeatLevelClass(limitNum);
                const riseVal = Number(b.change || 0);
                const riseClass = riseVal >= 0 ? 'gain-red' : 'gain-green';
                const riseStr = `${riseVal > 0 ? '+' : ''}${riseVal.toFixed(2)}%`;
                const lead = getLeadStock(b);
                const leadName = lead ? (lead.name || '--') : '--';
                const leadCode = lead ? (lead.code || '') : '';
                const leadRise = lead ? Number(lead.change_rate) : null;
                const leadRiseHtml = (leadRise !== null && !isNaN(leadRise)) ? `<span class="lead-stock-rise ${leadRise >= 0 ? 'gain-red' : 'gain-green'}">${leadRise > 0 ? '+' : ''}${leadRise.toFixed(2)}%</span>` : '';
                const driveText = (lead && lead.reason_type) ? lead.reason_type : (b.name || '—');
                const headerRight = `<div style="display:flex; align-items:center;"><span class="plate-rise-in-header ${riseClass}">${riseStr}</span><span class="heat-area ${heatClass}"><span class="heat-icon">${heatIcon}</span><span class="heat-value">${limitNum}家</span></span></div>`;
                html += `<div class="event-item ${activeClass}" data-code="${b.code}">
                    <div class="event-header"><div class="event-title-wrapper"><span class="${rankClass}">${rank}</span><span class="event-title">${escapeHtml(b.name || '--')}</span></div>${headerRight}</div>
                    <div class="concept-row">
                    <div class="plate-meta-row"><div class="plate-stats-group"><span>涨停家数 <span class="plate-limit">${limitNum}</span></span><span>连板 <span class="plate-limit">${b.continuous_plate_num || 0}</span></span><span>高度 <span class="plate-limit">${escapeHtml(b.high || '--')}</span></span></div>
                    <div class="lead-stock" data-code="${leadCode}" data-name="${escapeAttr(leadName)}">领涨股：<span class="lead-stockname">${escapeHtml(leadName)} ${leadCode}</span>${leadRiseHtml}</div></div>
                    <div class="drive-event-row">驱动事件：<span class="drive-event-text">${escapeHtml(driveText)}</span></div>
                    </div>
                </div>`;
            });
        } else if(currentView === 'hug') {
            // 抱团视图
            leftPanelTitle.innerText = '🤝 抱团主线';
            // 环境冰点条 —— 抱团取暖的前提条件
            html += renderHugEnvBar();
            if(!hugGroups.length){
                html += `<div class="empty">${escapeHtml(hugEnv.text)}环境下未形成抱团主线<br><span style="font-size:11px;">游资抱团取暖需同时满足：冰点环境 + 资金聚焦 + 龙头梯队 + 出手同步</span></div>`;
                eventListContainer.innerHTML = html;
                bindHugEvents();
                return;
            }
            hugGroups.forEach((g, idx) => {
                const rank = idx + 1;
                let rankClass = 'rank-badge';
                if(rank === 1) rankClass += ' rank-1';
                else if(rank === 2) rankClass += ' rank-2';
                else if(rank === 3) rankClass += ' rank-3';
                const activeClass = (currentHugKey === g.key) ? 'active' : '';
                const chipNames = g.isAll ? [] : (g.boards || []);
                let chips = '';
                chipNames.slice(0, 5).forEach(n => { chips += `<span class="concept-badge">${escapeHtml(n)}</span>`; });
                if(chipNames.length > 5) chips += `<span class="concept-badge">+${chipNames.length - 5}</span>`;
                const lead = g.lead;
                const leadName = lead ? (lead.name || '--') : '--';
                const leadCode = lead ? (lead.code || '') : '';
                const leadRise = lead ? Number(lead.change_rate) : null;
                const leadRiseHtml = (leadRise !== null && !isNaN(leadRise)) ? `<span class="lead-stock-rise ${leadRise >= 0 ? 'gain-red' : 'gain-green'}">${leadRise > 0 ? '+' : ''}${leadRise.toFixed(2)}%</span>` : '';
                const sb = (g.scored && g.scored.length) ? g.scored[0] : null;
                const dimsText = (sb && !g.isAll)
                    ? `聚焦${sb.conc.toFixed(0)} 梯队${sb.ladder.toFixed(0)} 同步${sb.sync.toFixed(0)} 动机${sb.motive.toFixed(0)}`
                    : '';
                let countText;
                if(g.isAll){
                    countText = `抱团股 ${g.count} 只 · ${g.boardCount} 条主线`;
                } else {
                    const zt = g.line ? g.line.ztN : 0;
                    const cont = g.line ? g.line.contBoardN : 0;
                    countText = `抱团股 ${g.count} 只 · 板块涨停 ${zt} 家 · 连板家 ${cont}`;
                }
                const boardChipRow = g.isAll ? '' :
                    `<div class="concept-row"><div class="event-concept-row"><span class="concept-label">🔗 合并板块(${chipNames.length})：</span><div class="concept-badge-list">${chips}</div></div></div>`;
                html += `<div class="event-item ${activeClass}" data-hug-key="${escapeAttr(g.key)}">
                    <div class="event-header"><div class="event-title-wrapper"><span class="${rankClass}">${rank}</span><span class="event-title">${escapeHtml(g.title)}</span></div>
                    <div style="display:flex;align-items:center;white-space:nowrap;"><span class="hug-tag hug-${g.level}">${g.label}</span><span class="hug-score hug-${g.level}">${g.score.toFixed(0)}分</span></div></div>
                    ${boardChipRow}
                    <div class="plate-meta-row" style="font-size:12px;color:#8c909a;"><span>${countText}</span><span>${dimsText}</span></div>
                    <div class="event-direction-row"><div class="lead-stock" data-code="${leadCode}" data-name="${escapeAttr(leadName)}">总龙：<span class="lead-stockname">${escapeHtml(leadName)} ${leadCode}</span>${leadRiseHtml}</div></div></div>
                </div>`;
            });
        } else {
            // 炸板 / 跌停 视图：左侧=个股池列表（过滤ST/新股）
            const isBroken = currentView === 'broken';
            leftPanelTitle.innerText = isBroken ? '💥 炸板池' : '📉 跌停池';
            const rows = getPoolRows(isBroken);
            if(!rows.length){
                html = `<div class="empty">当日无${isBroken ? '炸板' : '跌停'}个股（已过滤ST/新股）</div>`;
            }
            rows.forEach((s, idx) => {
                const rank = idx + 1;
                let rankClass = 'rank-badge';
                if(rank === 1) rankClass += ' rank-1';
                else if(rank === 2) rankClass += ' rank-2';
                else if(rank === 3) rankClass += ' rank-3';
                const rise = Number(s.change_rate ?? 0);
                const riseCls = rise >= 0 ? 'gain-red' : 'gain-green';
                const riseStr = `${rise > 0 ? '+' : ''}${rise.toFixed(2)}%`;
                const timeText = isBroken ? ('炸板 ' + formatTimeHM(s.last_limit_up_time)) : ('跌停 ' + (s._downText || '--:--'));
                const activeClass = (poolActiveCode === s.code) ? 'active' : '';
                html += `<div class="event-item pool-item ${activeClass}" data-code="${s.code || ''}">
                    <div class="event-header"><div class="event-title-wrapper"><span class="${rankClass}">${rank}</span><span class="event-title">${escapeHtml(s.name || '--')}</span></div>
                    <span class="plate-rise-in-header ${riseCls}">${riseStr}</span></div>
                    <div class="pool-sub"><span>${s.code || '--'}</span><span>${escapeHtml(timeText)}</span></div>
                </div>`;
            });
        }
        eventListContainer.innerHTML = html;
        // 板块点击 -> 切换右侧
        document.querySelectorAll('.event-item').forEach(item => {
            item.addEventListener('click', (e) => {
                if(e.target.closest('.lead-stock')) return;
                // 炸板/跌停池个股点击 -> 右侧定位高亮
                if(currentView === 'broken' || currentView === 'down'){
                    const poolCode = item.getAttribute('data-code');
                    if(poolCode){
                        poolActiveCode = poolCode;
                        renderLeftPanelByView();
                        showPane('detail');
                        setTimeout(() => scrollToPoolRow(poolCode), 60);
                    }
                    return;
                }
                // 抱团分组点击 -> 右侧输出成分股
                const hugKey = item.getAttribute('data-hug-key');
                if(hugKey !== null && hugKey !== undefined){
                    if(currentHugKey === hugKey){
                        // 已是当前主线：移动端仍需切到明细页
                        showPane('detail');
                        return;
                    }
                    currentHugKey = hugKey;
                    renderLeftPanelByView();
                    updateHugRightPanel();
                    showPane('detail');
                    return;
                }
                const code = item.dataset.code;
                if(currentBlock && currentBlock.code === code){
                    // 已是当前板块：移动端仍需切到明细页
                    showPane('detail');
                    return;
                }
                const selected = allBlocksRaw.find(b => b.code === code);
                if(selected){
                    currentBlock = selected;
                    activeReasonTag = null;
                    renderLeftPanelByView();
                    updateRightPanel();
                    showPane('detail');
                }
            });
        });
        // 领涨股点击
        document.querySelectorAll('.lead-stock').forEach(el => {
            el.addEventListener('click', (e) => {
                e.stopPropagation();
                const code = el.getAttribute('data-code');
                if(code) openStock(code, el.getAttribute('data-name'));
            });
        });
    }

    // ------------------- 抱团：环境冰点条 + 事件绑定 -------------------
    // 抱团取暖的"动机"来自行情冰点，因此把环境状态前置显示，避免把普涨日误读成抱团
    function renderHugEnvBar(){
        const ud = hugUpDown || {};
        const up = Number(ud.up) || 0, down = Number(ud.down) || 0;
        const red = (up + down) ? (up / (up + down) * 100) : 0;
        const sealRate = (hugZtTotal + hugFailTotal) ? (hugZtTotal / (hugZtTotal + hugFailTotal) * 100) : 0;
        const items = [
            ['涨停', hugZtTotal, 'up'],
            ['炸板', hugFailTotal, 'down'],
            ['跌停', Number(ud.limit_down) || 0, 'down'],
            ['封板率', sealRate.toFixed(0) + '%', 'flat'],
            ['最高板', hugMaxHeight + '板', 'flat'],
            ['红盘率', red.toFixed(0) + '%', red < 40 ? 'down' : 'up']
        ];
        const cells = items.map(it =>
            `<span class="hug-env-cell"><i class="hug-env-k">${it[0]}</i><b class="hug-env-v hug-env-${it[2]}">${it[1]}</b></span>`
        ).join('');
        const hint = hugIceScore >= 70 ? '深度冰点 · 游资缩容抱团取暖'
                    : hugIceScore >= 55 ? '退潮期 · 资金收缩抱团'
                    : hugIceScore >= 40 ? '混沌期 · 抱团信号弱'
                    : '修复/高潮 · 无抱团取暖基础';
        return `<div class="hug-env-bar">
            <div class="hug-env-head"><span class="hug-env-title">🌡 情绪环境</span>
                <span class="hug-env-badge ${hugEnv.level}">${escapeHtml(hugEnv.text)}</span>
                <span class="hug-env-score">冰点分 ${hugIceScore}</span></div>
            <div class="hug-env-cells">${cells}</div>
            <div class="hug-env-hint">${escapeHtml(hint)}</div>
        </div>`;
    }

    function bindHugEvents(){
        // 抱团分组点击 -> 切换右侧
        document.querySelectorAll('.event-item[data-hug-key]').forEach(item => {
            item.addEventListener('click', (e) => {
                if(e.target.closest('.lead-stock')) return;
                const hugKey = item.getAttribute('data-hug-key');
                if(hugKey === currentHugKey) return;
                currentHugKey = hugKey;
                renderLeftPanelByView();
                updateHugRightPanel();
                showPane('detail');
            });
        });
        document.querySelectorAll('.lead-stock').forEach(el => {
            el.addEventListener('click', (e) => {
                e.stopPropagation();
                const code = el.getAttribute('data-code');
                if(code) openStock(code, el.getAttribute('data-name'));
            });
        });
    }

    // ------------------- 右侧: 驱动事件 / 子概念 / 股票池 -------------------
    function resetDriverExpandState(){
        driverContentDiv.classList.remove('expanded');
        driverContentDiv.style.maxHeight = '';
        expandBtn.style.display = 'none';
        expandBtn.innerText = '展开 ▼';
        driverContentDiv.style.overflow = 'hidden';
    }

    function updateDriverUI(contentHtml){
        if(!contentHtml || contentHtml.trim() === ''){
            driverContentDiv.innerHTML = '<span style="color:#8c909a;">暂无详细事件描述</span>';
            resetDriverExpandState();
            return;
        }
        driverContentDiv.innerHTML = contentHtml;
        driverContentDiv.style.maxHeight = 'none';
        driverContentDiv.classList.remove('expanded');
        const scrollHeight = driverContentDiv.scrollHeight;
        const threshold = 75;
        if(scrollHeight > threshold){
            driverContentDiv.style.maxHeight = threshold + 'px';
            driverContentDiv.style.overflow = 'hidden';
            expandBtn.style.display = 'inline-block';
            expandBtn.innerText = '展开 ▼';
            expandBtn.onclick = () => {
                if(driverContentDiv.classList.contains('expanded')){
                    driverContentDiv.classList.remove('expanded');
                    driverContentDiv.style.maxHeight = threshold + 'px';
                    expandBtn.innerText = '展开 ▼';
                } else {
                    driverContentDiv.classList.add('expanded');
                    driverContentDiv.style.maxHeight = scrollHeight + 'px';
                    expandBtn.innerText = '收起 ▲';
                }
            };
        } else {
            driverContentDiv.style.maxHeight = 'none';
            expandBtn.style.display = 'none';
        }
    }

    function updateRightPanel(){
        if(currentView === 'hug'){ updateHugRightPanel(); return; }
        if(currentView === 'broken' || currentView === 'down'){ renderPoolRightPanel(currentView === 'broken'); return; }
        driverEventBox.style.display = '';
        if(!currentBlock){ clearRightPanel(); return; }
        const lead = getLeadStock(currentBlock);
        driverSubtitleSpan.innerHTML = `驱动事件：${escapeHtml(currentBlock.name || '--')}`;
        driverSubtitleSpan.style.display = 'block';
        let contentHtml = '';
        if(lead && lead.reason_info){
            contentHtml = `<span style="color:#ffaa33;">【领涨股 ${escapeHtml(lead.name || '')} ${lead.code || ''}】</span><br>` + escapeHtml(lead.reason_info).replace(/\n/g, '<br>');
        }
        updateDriverUI(contentHtml);
        showBlockEmotion(currentBlock);
        currentStocksAll = filterStocks(currentBlock.stock_list);
        renderSubTabs();
        filterAndDisplayStocks();
    }

    // 抱团视图右侧: 输出所选抱团主线的抱团股
    function updateHugRightPanel(){
        driverEventBox.style.display = '';
        hideEmotion();
        let g = hugGroups.find(x => x.key === currentHugKey);
        if(!g && hugGroups.length){ g = hugGroups[0]; currentHugKey = g.key; }
        if(!g){ clearRightPanel(); return; }
        driverSubtitleSpan.innerHTML = `抱团主线：${escapeHtml(g.title)}`;
        driverSubtitleSpan.style.display = 'block';

        const sb = (g.scored && g.scored.length) ? g.scored[0] : null;
        let contentHtml = `<span class="hug-tag hug-${g.level}">${g.label}</span> <span class="hug-score hug-${g.level}" style="font-size:16px;">${g.score.toFixed(1)}分</span>`;

        // 环境说明（抱团的前提）
        contentHtml += `<br><span style="color:#9aa0b5;">【环境】</span>${escapeHtml(hugEnv.text)} · 冰点分 ${hugIceScore} · 抱团判定线 ${hugEnv.gate} 分` +
            (hugEnv.text === '修复/高潮' ? `<br><span style="color:#ff9b43;">当前为修复/高潮行情，增量资金活跃、赚钱效应扩散，游资无需"抱团取暖"；此处仅列出资金聚焦度最高的主线供参考。</span>` : '');

        if(g.isAll){
            contentHtml += `<br><span style="color:#ffaa33;">【抱团股清单】</span>共 <b style="color:#ff7b72;">${g.count}</b> 只，来自 ${g.boardCount} 条抱团主线（全市场涨停 ${g.marketTotal} 家、炸板 ${hugFailTotal} 家），主线均分 ${(g.avgScore || 0).toFixed(1)}。`;
            contentHtml += `<br><span style="color:#6c6f8a;">游资抱团取暖 = 钱堆到少数几只高辨识度票上，故全市场抱团股通常仅 3~8 只；超过 12 只即为量化扩散，不构成抱团。</span>`;
        } else if(sb && g.line){
            const ln = g.line;
            contentHtml += `<br><span style="color:#ffaa33;">【评分构成】</span>资金聚焦 ${sb.conc.toFixed(1)}/30（板块封单占全市场 ${(sb.fundRatio*100).toFixed(1)}%、涨停占比 ${(sb.ztRatio*100).toFixed(1)}%） · 梯队 ${sb.ladder.toFixed(1)}/25（最高 ${sb.maxH} 板、连板 ${sb.contN} 只） · 同步 ${sb.sync.toFixed(1)}/25 · 冰点动机 ${sb.motive.toFixed(1)}/20`;
            contentHtml += `<br><span style="color:#ffaa33;">【抱团结构】</span>总龙 <b style="color:#ff7b72;">${escapeHtml((ln.anchor && ln.anchor.name) || '--')}</b> ${ln.anchor ? ln.anchor._continue + '板' : ''} · 板块涨停 ${ln.ztN} 家 · 连板家 ${ln.contBoardN} · 合并板块 ${ln.boards.length} 个`;
            const roleTxt = (g.picks || []).map(p => `${escapeHtml(p[0].name)}(${escapeHtml(p[1])})`).join(' + ');
            contentHtml += `<br><span style="color:#ffaa33;">【抱团梯队】</span>${roleTxt}`;
            let chips = '';
            ln.boards.slice(0, 30).forEach(n => { chips += `<span class="concept-badge">${escapeHtml(n)}</span>`; });
            contentHtml += `<div class="concept-badge-list" style="margin-top:4px;">${chips}</div>`;
        }
        updateDriverUI(contentHtml);
        subTabContainer.style.display = 'none';
        const stocks = (g.picks || []).map(p => p[0]);
        currentStocksAll = stocks;
        renderHugStockTable(g);
    }

    function clearRightPanel(){
        driverEventBox.style.display = '';
        driverContentDiv.innerHTML = '<span style="color:#8c909a;">暂无详细事件描述</span>';
        driverSubtitleSpan.style.display = 'none';
        resetDriverExpandState();
        subTabContainer.style.display = 'none';
        hideEmotion();
        stockTbody.innerHTML = '<tr><td colspan="8" class="empty">暂无成分股</td></tr>';
        stockCountLabel.innerText = '股票池 (0)';
        currentStocksAll = [];
    }

    function renderSubTabs(){
        const tags = currentBlock ? getBlockReasonTags(currentBlock, 12) : [];
        if(!tags.length){ subTabContainer.style.display = 'none'; return; }
        subTabContainer.style.display = 'flex';
        let html = `<span class="sub-tab ${activeReasonTag === null ? 'active' : ''}" data-tag="">📊 全部</span>`;
        tags.forEach(t => { html += `<span class="sub-tab ${activeReasonTag === t ? 'active' : ''}" data-tag="${escapeAttr(t)}">📌 ${escapeHtml(t)}</span>`; });
        subTabContainer.innerHTML = html;
        document.querySelectorAll('.sub-tab').forEach(tab => {
            tab.addEventListener('click', (e) => {
                const tag = e.currentTarget.dataset.tag;
                activeReasonTag = (tag === '') ? null : tag;
                renderSubTabs();
                filterAndDisplayStocks();
            });
        });
    }

    function filterAndDisplayStocks(){
        if(activeReasonTag === null){ renderLimitUpTable(currentStocksAll); return; }
        const filtered = currentStocksAll.filter(s => s.reason_type && String(s.reason_type).includes(activeReasonTag));
        renderLimitUpTable(filtered);
    }

    // 从板块榜个股中查涨停解析（抱团股来自涨停池，缺 reason_info，按代码回补）
    function getBlockStockInfo(code){
        for(const b of allBlocksRaw){
            for(const s of (b.stock_list || [])){
                if(String(s.code) === String(code)) return s;
            }
        }
        return null;
    }

    // 抱团股专用表格（图一样式：8列明细 + 解析行；名称附角色徽标，解析行附封单/换手）
    function renderHugStockTable(g){
        setTableHeader([{t:'代码/名称'},{t:'现价'},{t:'涨幅'},{t:'几天几板',sort:'high'},{t:'首封时间',sort:'firstTime'},{t:'终封时间',sort:'lastTime'},{t:'形态'},{t:'涨停原因'}]);
        const picks = g.picks || [];
        if(!picks.length){
            stockTbody.innerHTML = '<tr><td colspan="8" class="empty">该主线暂无符合条件的抱团股</td></tr>';
            stockCountLabel.innerText = '抱团股 (0)';
            return;
        }
        const pairs = picks.map(p => [p[0], p[1]]);
        let ordered;
        if(currentSortField){
            ordered = applySort(pairs.map(p => p[0])).map(s => pairs.find(p => p[0] === s));
        } else {
            ordered = pairs;
        }
        let rows = '';
        ordered.forEach(p => {
            const s = p[0], role = p[1];
            const rise = Number(s.change_rate ?? 0);
            const gainClass = rise >= 0 ? 'gain-positive' : 'gain-negative';
            const cont = s._continue || 0;
            const boards = s._totalBoards || parseTotalBoards(s);
            const roleTag = role
                ? `<span class="hug-role hug-role-${role.indexOf('总龙') === 0 ? 'lead' : (role.indexOf('分支') === 0 ? 'branch' : 'alive')}">${escapeHtml(role)}</span>`
                : '';
            const contTag = cont >= 2
                ? `<span class="hug-cont">${cont}连板</span>`
                : (boards >= 2 ? `<span class="hug-cont hug-cont-rev">${boards}板反包</span>` : '');
            const highText = s.high || s.high_days || (cont >= 2 ? cont + '连板' : '首板');
            const tagCls = s.change_tag === 'LIMIT_BACK' ? 'limit-back' : (s.change_tag === 'LIMIT_FAILED' ? 'limit-fail' : '');
            const reason = (s.reason_type && String(s.reason_type).trim()) ? s.reason_type : '题材驱动';
            const turn = Number(s.turnover_rate);
            const fundText = fmtFund(s.order_amount);
            // 涨停解析：优先板块榜个股 reason_info
            const bs = getBlockStockInfo(s.code);
            const info = (bs && bs.reason_info) ? bs.reason_info : (s.reason_info || '暂无详细解析');
            rows += `<tr class="stock-row-main" data-code="${s.code || ''}" data-name="${escapeAttr(s.name || '')}">
                <td class="stock-code-name">${roleTag}${escapeHtml(s.name || '--')}${contTag}<br>${s.code || '--'}</td>
                <td>${s.latest ?? '--'}</td>
                <td class="${gainClass}">${rise > 0 ? '+' : ''}${rise.toFixed(2)}%</td>
                <td>${escapeHtml(highText)}</td>
                <td>${formatTimeHM(s.first_limit_up_time)}</td>
                <td>${formatTimeHM(s.last_limit_up_time)}</td>
                <td><span class="limit-badge ${tagCls}">${s.change_tag ? mapChangeTag(s.change_tag) : '涨停'}</span></td>
                <td class="reason-type" title="${escapeAttr(reason)}">${escapeHtml(reason)}</td>
            </tr>`;

    function applyCellLabels(){

            if(tr.classList.contains('stock-detail-row')) return;
            const tds = tr.querySelectorAll('td');

            });

    // 首次跌停时间估算：time_preview 为全天约80个3分钟粒度涨幅点，找到首个触及跌停幅度的点
    function estimateDownTime(s){
        const arr = s.time_preview;
        if(!Array.isArray(arr) || !arr.length) return null;
        const nm = String(s.name || ''), cd = String(s.code || '');
        const th = nm.includes('ST') ? -4.5 : ((cd.startsWith('30') || cd.startsWith('68')) ? -19.5 : -9.5);
        for(let i = 0; i < arr.length; i++){
            if(Number(arr[i]) <= th){
                return (i < 40) ? (9 * 60 + 30 + i * 3) : (13 * 60 + (i - 40) * 3);
            }
        }
        return null;
    }

    // ------------------- API 数据加载 -------------------
    async function fetchTradeDays(baseDateYYYYMMDD){
        const url = `${TRADE_DAY_API}?date=${baseDateYYYYMMDD}&stock=stock&next=30&prev=30`;
        try {
            const resp = await fetch(url, { headers: { 'User-Agent': USER_AGENT } });
            const json = await resp.json();
            if(json.status_code === 0 && json.data){
                let dates = [];
                if(json.data.prev_dates) dates.push(...json.data.prev_dates);
                if(json.data.next_dates) dates.push(...json.data.next_dates);
                if(json.data.trade_day === true && !dates.includes(baseDateYYYYMMDD)) dates.push(baseDateYYYYMMDD);
                dates = [...new Set(dates)];
                dates.sort((a, b) => a.localeCompare(b));
                return dates;
            }
            return [];
        } catch(e){ console.warn(e); return []; }
    }

    const HUG_FIELDS = '199112,10,9001,330323,330324,330325,9002,330329,133971,133970,1968584,3475914,9003,9004,330338,330340,330339,133976,133977,1968585';

    // 同花顺单页上限 200，需分页
    async function fetchPoolAll(apiName, dateYYYYMMDD){
        const rows = [];
        for(let page = 1; page <= 2; page++){
            const url = `${apiName}?page=${page}&limit=200&field=${HUG_FIELDS}&filter=HS,GEM2STAR&date=${dateYYYYMMDD}`;
            try {
                const resp = await fetch(url, { headers: { 'User-Agent': USER_AGENT } });
                const json = await resp.json();
                if(json.status_code === 0 && json.data && Array.isArray(json.data.info)){
                    rows.push(...json.data.info);
                    if(json.data.info.length < 200) break;
                } else break;
            } catch(e){ console.warn('获取' + apiName + '失败', e); break; }
        }
        return rows;
    }

    // 涨停池：提供封单额/首封时间/换手率/板型 —— 游资抱团的"资金聚焦"与"出手同步"依据
    async function fetchLimitUpPool(dateYYYYMMDD){
        const rows = await fetchPoolAll(LIMIT_UP_POOL_API, dateYYYYMMDD);
        const map = new Map();
        let allFund = 0, maxH = 0;
        rows.forEach(r => {
            if(!r.code) return;
            const s = Object.assign({}, r);
            s._continue = 0;            // 连板数后续由板块榜补齐
            s._totalBoards = parseTotalBoards(s);
            map.set(r.code, s);
            allFund += Number(r.order_amount) || 0;
        });
        return { map: map, rows: rows, allFund: allFund };
    }

        const rows = await fetchPoolAll(OPEN_LIMIT_POOL_API, dateYYYYMMDD);
